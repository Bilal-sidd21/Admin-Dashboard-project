        <nav class="flex-1 p-4">

            <li>
              <a href="index.html" class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm text-gray-600 hover:bg-gray-100">

            <li>
              <a href="user.html" class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm text-gray-600 hover:bg-gray-100">

            <li>

          <a href="setting.html" class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm text-gray-600 hover:bg-gray-100 mb-1">
            <i class="fa-solid fa-gear w-4"></i>

            <span>Logout</span>
          </a>

      <main class="flex-1 md:ml-50">
        <div>

          <header class="min-h-20 bg-white border-b border-gray-200 flex flex-wrap sm:flex-nowrap items-center justify-between gap-3 px-3 sm:px-6 py-3">
  
  <!-- Left Side: Mobile Menu Button & Title -->
  <div class="flex items-center gap-3 min-w-0 flex-1">
    <button id="menubtn" class="md:hidden shrink-0 w-10 h-10 flex items-center justify-center border border-gray-200 rounded-md">
      <i class="fa-solid fa-bars"></i>
    </button>
    <div class="min-w-0 flex-1">
      <h2 class="text-base sm:text-lg font-semibold truncate">
        Analytics Overview
      </h2>
      <p class="text-xs text-gray-500 truncate">
        Product, User & Revenue
      </p>
    </div>
  </div>

  <!-- Right Side: Dark Mode & Login Buttons -->
  <div class="flex items-center gap-2 sm:gap-3 shrink-0">
    
    <!-- Dark Mode Toggle Button -->
    <button
      id="themeToggleBtn"
      title="Toggle Theme"
      class="w-9 h-9 flex items-center justify-center rounded-lg border border-gray-200 text-gray-600 hover:bg-gray-100 transition-colors"
    >
      <i class="fa-solid fa-moon text-sm" id="themeIcon"></i>
    </button>

    <!-- Login Button -->
    <a
      href="login.html"
      class="flex items-center gap-2 px-3.5 py-2 bg-blue-600 hover:bg-blue-700 text-white text-xs sm:text-sm font-medium rounded-lg shadow-sm transition-colors"
    >
      <i class="fa-solid fa-right-to-bracket"></i>
      <span>Login</span>
    </a>

  </div>

</header>
          <div class="p-4 sm:p-6 space-y-6">
          
            <div class="flex flex-col sm:flex-row items-center justify-between gap-4 bg-white p-4 rounded-lg border border-gray-200">
              <div class="relative w-full sm:w-72">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-xs text-gray-400"></i>
                <input id="searchCategoryInput" type="text" placeholder="Search category..." class="w-full pl-9 pr-4 py-1.5 text-xs border border-gray-200 rounded-lg focus:outline-none focus:border-blue-500" />
              </div>

              <div class="flex items-center gap-2 w-full sm:w-auto">
                <select id="statusCategoryFilter" class="w-full sm:w-auto text-xs border border-gray-200 rounded-lg px-3 py-1.5 bg-white text-gray-600 focus:outline-none">
                  <option value="ALL">All Status</option>
                  <option value="ACTIVE">Active</option>
                  <option value="INACTIVE">Inactive</option>
                </select>
              </div>
            </div>

   
            <div id="categoryGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
            </div>

          </div>
        </div>

       
        <footer class="border-t border-gray-200 bg-white px-4 sm:px-6 py-4">
          <div class="flex flex-col sm:flex-row items-center justify-between gap-3">
            <p class="text-xs text-gray-500">© 2026 Predown Solutions</p>
            <div class="flex gap-4 text-xs text-gray-400">
              <a href="#" class="hover:text-gray-600">Privacy Policy</a>
              <a href="#" class="hover:text-gray-600">Terms of Service</a>
              <a href="#" class="hover:text-gray-600">Support</a>
            </div>
          </div>
        </footer>
      </main>
    </div>

  
    <div id="categoryModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
      <div class="bg-white w-full max-w-md rounded-lg border border-gray-200 shadow-xl overflow-hidden">
        <div class="flex items-center justify-between p-4 border-b border-gray-100">
          <h3 class="text-sm font-semibold text-gray-800">Add New Category</h3>
          <button id="closeCategoryModal" class="text-gray-400 hover:text-gray-600 text-sm">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
        <form id="categoryForm" class="p-4 space-y-4">
          <div>
            <label class="block text-xs font-medium text-gray-700 mb-1">Category Name</label>
            <input type="text" id="catName" required placeholder="e.g. Electronics" class="w-full px-3 py-1.5 text-xs border border-gray-200 rounded-lg focus:outline-none focus:border-blue-500" />
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-700 mb-1">Total Products</label>
            <input type="number" id="catCount" required min="0" placeholder="0" class="w-full px-3 py-1.5 text-xs border border-gray-200 rounded-lg focus:outline-none focus:border-blue-500" />
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-700 mb-1">Status</label>
            <select id="catStatus" class="w-full px-3 py-1.5 text-xs border border-gray-200 rounded-lg focus:outline-none focus:border-blue-500 bg-white">
              <option value="ACTIVE">Active</option>
              <option value="INACTIVE">Inactive</option>
            </select>
          </div>
          <div class="flex justify-end gap-2 pt-2 border-t border-gray-100">
            <button type="button" id="cancelCategoryModal" class="px-3 py-1.5 text-xs text-gray-600 hover:bg-gray-100 rounded-lg">Cancel</button>
            <button type="submit" class="px-4 py-1.5 text-xs bg-blue-600 text-white font-medium rounded-lg hover:bg-blue-700">Save Category</button>
          </div>
        </form>
      </div>
    </div>

    <script src="js/categories.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
